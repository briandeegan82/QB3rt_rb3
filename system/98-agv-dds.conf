# QB3rt: kernel UDP socket buffer limits for DDS large messages.
#
# CycloneDDS requests SO_RCVBUF per /etc/qb3rt/cyclonedds.xml
# (SocketReceiveBufferSize min=16MB), but the kernel silently caps that at
# net.core.rmem_max (default ~208 kB - a seventh of ONE 1.4 MB camera frame).
# Undersized buffers drop UDP fragments whenever a subscriber is briefly busy,
# and under BEST_EFFORT QoS one lost fragment discards the whole image
# (root cause of the 2026-07-13 dead /image_raw -> no VIO).
#
# Apply now:  sysctl --system     (also applied automatically at boot)
net.core.rmem_max=33554432
net.core.rmem_default=1048576
net.core.wmem_max=8388608
