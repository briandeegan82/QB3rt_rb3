# Installed to /etc/NetworkManager/conf.d/ by reference/20_fleet_config.sh
# (golden image) and the ansible wifi_powersave_off role (backfill).
#
# 2 = disable. With power save on at both ends, an excellent link (-41 dBm,
# 433 Mb/s) measured 35% packet loss and 2.3 s avg / 4.8 s max RTT; off, 0%
# loss and 5.5 ms avg. A runtime `iw dev wlan0 set power_save off` does not
# survive NetworkManager reassociating, so it has to be the NM default.
# Global default rather than per-profile, so it also covers profiles that
# stamp/ or a student recreates.
[connection]
wifi.powersave = 2
