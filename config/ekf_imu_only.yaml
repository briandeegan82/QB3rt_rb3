# IMU-only EKF for QB3rt (lidar-only path; no OAK-D camera).
#
# Fuses only the RB3 board IMU (/imu/data): yaw rate (gyro) + forward accel.
# With no position or velocity odometry source, the EKF integrates heading from
# the gyro alone. Drift accumulates, but slam_toolbox (map->odom) corrects it.
#
# Use this config when the OAK-D is not running (lidar_nav.launch.py).
# For the full VIO+IMU fusion, see ekf.yaml.
ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    imu0: /imu/data
    # x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    # Fuse only yaw rate (vyaw) and forward accel (ax). Absolute yaw is NOT fused:
    # the ICM-42688 has no magnetometer, so its orientation yaw is gyro-integrated
    # (arbitrary origin, drifts). The EKF integrates heading from the rate.
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
