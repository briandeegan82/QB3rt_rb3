---
# convention-probe — measure one unit's hardware conventions, stamp the
# baseline into /etc/qb3rt/unit_conventions.yaml, then VERIFY it live.
#
# Flow (INTERACTIVE — the robot drives; watch it):
#   1. preflight   raw-serial health check + kill every stale ROS process
#                  (fails fast on dead/flapping adapters, missing symlinks)
#   2. stack       qb3rt-stack@odometry (bridge + IMU) + @rplidar_c1
#   3. probe       bounded +x / +z pulses; lidar delta + IMU classify
#                  drive_inverted; nearest-cluster angle gives lidar_yaw
#   4. verify      bridge restarts under the written conventions, one +x
#                  pulse, operator confirms; backward flips and re-tests
#
# Run:  ansible-playbook playbooks/convention-probe.yml -l qb3rt-7
#
# Results are fetched back into ./convention-results/<host>.yaml.
- name: Per-unit hardware convention probe
  hosts: qb3rt_fleet
  gather_facts: false
  serial: 1          # one robot at a time — it moves and needs watching
  tasks:
    - name: Probe (probe units are always stopped afterwards)
      block:
        - name: Operator notice — robot will drive ~0.2 m and spin twice
          ansible.builtin.pause:
            prompt: >-
              Put {{ inventory_hostname }} on the floor with ~1 m clear in every
              direction. You will also need a tall object (box/tripod) to place at
              its nose mid-probe. Press ENTER to begin.

        - name: Install probe + preflight scripts (self-contained — never stale)
          ansible.builtin.copy:
            src: "../roles/qb3rt_base/files/{{ item.src }}"
            dest: "/usr/local/sbin/{{ item.dest }}"
            mode: "0755"
          become: true
          loop:
            - { src: qb3rt-convention-probe.py, dest: qb3rt-convention-probe }
            - { src: qb3rt-preflight.py,        dest: qb3rt-preflight }

        - name: Hardware preflight (stops stale stacks; fails fast)
          ansible.builtin.command: qb3rt-preflight
          become: true
          register: preflight_out

        - name: Show preflight output
          ansible.builtin.debug: var=preflight_out.stdout_lines

        - name: Start odometry stack (bridge + IMU) as a systemd service
          # qb3rt-up stops other stacks and reaps orphans first — the old
          # systemd-run leftovers fought over /dev/wave_rover. The service
          # runs as ubuntu with the fleet ROS env; stop sends SIGINT so
          # launch tears its children down cleanly.
          ansible.builtin.command: qb3rt-up odometry enable_base_driver:=true
          become: false
          changed_when: false

        - name: Start lidar alongside (separate instance — qb3rt-up would stop odometry)
          ansible.builtin.command: systemctl start qb3rt-stack@rplidar_c1
          become: true

        - name: Wait for the bridge node (up to 60 s)
          ansible.builtin.shell: |
            source /etc/profile
            for i in $(seq 1 30); do
              ros2 node list 2>/dev/null | grep -qx /waverover_bridge && exit 0
              sleep 2
            done
            echo "bridge node never appeared"; exit 1
          args:
            executable: /bin/bash

        # The qrb IMU composable component can silently fail to load into
        # imu_container (seen on qb3rt-10 and qb3rt-12): the container runs but
        # /imu/data never publishes. Detect and load it manually.
        - name: Ensure the IMU component actually publishes /imu/data
          ansible.builtin.shell: |
            source /etc/profile
            timeout 8 ros2 topic hz /imu/data --window 10 2>/dev/null | grep -q average && exit 0
            # The container takes a few seconds to register on DDS after launch —
            # wait for it before attempting the component load.
            for i in $(seq 1 30); do
              ros2 node list 2>/dev/null | grep -qx /imu_container && break
              sleep 2
            done
            ros2 component load /imu_container qrb_ros_imu qrb_ros::imu::ImuComponent \
              --node-name imu --remap imu:=/imu/data
            sleep 4
            timeout 8 ros2 topic hz /imu/data --window 10 2>/dev/null | grep -q average
          become: false
          args:
            executable: /bin/bash

        - name: Wait for /scan (up to 30 s)
          ansible.builtin.shell: |
            source /etc/profile
            timeout 8 ros2 topic hz /scan --window 10 2>/dev/null | grep -q average && exit 0
            sleep 10
            timeout 8 ros2 topic hz /scan --window 10 2>/dev/null | grep -q average
          args:
            executable: /bin/bash

        - name: Place calibration object at the nose
          ansible.builtin.pause:
            prompt: >-
              Now place a tall object ~0.5 m in front of {{ inventory_hostname }}'s
              NOSE (the camera-facing end). Press ENTER when placed.

        - name: Run the convention probe (drives wheels, reads IMU + scan)
          # become + plain command = bare root env: no /etc/profile, so rclpy is
          # unimportable and the probe dies silently (failed_when:false masks it).
          # bash -lc loads the root login profile incl. the ROS env.
          ansible.builtin.command: bash -lc 'qb3rt-convention-probe --yes'
          become: true
          register: probe_out
          failed_when: false
          changed_when: true

        - name: Show probe output
          ansible.builtin.debug: var=probe_out.stdout_lines

        - name: Stop any residual stack motion
          ansible.builtin.command: >-
            bash -c 'source /etc/profile &&
                   ros2 topic pub /cmd_vel geometry_msgs/msg/Twist "{}" --once'
          failed_when: false
          changed_when: false

        # --- verify under the just-written conventions ----------------------
        - name: Restart bridge under the new conventions
          ansible.builtin.command: systemctl restart qb3rt-stack@odometry
          become: true

        - name: Wait for bridge again (up to 60 s)
          ansible.builtin.shell: |
            source /etc/profile
            for i in $(seq 1 30); do
              ros2 node list 2>/dev/null | grep -qx /waverover_bridge && exit 0
              sleep 2
            done
            exit 1
          args:
            executable: /bin/bash

        - name: VERIFY — forward pulse under written drive_inverted (WATCH IT)
          ansible.builtin.command: >-
            bash -lc 'qb3rt-convention-probe --drive-pulse --linear 0.2 --secs 2.0'
          become: true
          register: verify_pulse
          changed_when: true

        - name: Operator confirm — did it drive TOWARD the camera nose?
          ansible.builtin.pause:
            prompt: >-
              {{ inventory_hostname }} just pulsed. Did it move FORWARD
              (toward the camera/lidar nose)? Type 'y' + ENTER if yes,
              'b' + ENTER if it went BACKWARD, 'n' if it did not move.
          register: verify_ans

        - name: Backward — flip drive_inverted and re-test
          when: "'b' in verify_ans.user_input | default('')"
          block:
            - name: Flip drive_inverted in the conventions file
              # The probe may leave the key UNWRITTEN on weak sensor data —
              # sed alone would no-op and the re-pulse would test the same
              # wrong default. Missing key -> effective value is the bridge
              # yaml default (false), so the flip writes true.
              ansible.builtin.shell: |
                if grep -q '^drive_inverted: true' /etc/qb3rt/unit_conventions.yaml; then
                  sed -i 's/^drive_inverted:.*/drive_inverted: false/' /etc/qb3rt/unit_conventions.yaml
                elif grep -q '^drive_inverted:' /etc/qb3rt/unit_conventions.yaml; then
                  sed -i 's/^drive_inverted:.*/drive_inverted: true/' /etc/qb3rt/unit_conventions.yaml
                else
                  echo 'drive_inverted: true' >> /etc/qb3rt/unit_conventions.yaml
                fi
                grep '^drive_inverted' /etc/qb3rt/unit_conventions.yaml
              become: true
              args:
                executable: /bin/bash

            - name: Restart bridge + re-pulse
              ansible.builtin.shell: |
                source /etc/profile
                systemctl restart qb3rt-stack@odometry
                for i in $(seq 1 30); do
                  ros2 node list 2>/dev/null | grep -qx /waverover_bridge && break
                  sleep 2
                done
                bash -lc 'qb3rt-convention-probe --drive-pulse --linear 0.2 --secs 2.0'
              become: true
              args:
                executable: /bin/bash

            - name: Operator re-confirm — forward now?
              ansible.builtin.pause:
                prompt: >-
                  Flipped drive_inverted and re-pulsed. Did it move FORWARD
                  this time? Type 'y' + ENTER to accept the flipped value.

        - name: Fetch measured conventions back to the control host
          ansible.builtin.fetch:
            src: /etc/qb3rt/unit_conventions.yaml
            dest: "{{ playbook_dir }}/../convention-results/{{ inventory_hostname }}.yaml"
            flat: true
          failed_when: false

      # Always tear the probe's stack down — the services survive the SSH
      # session by design, so nothing else would ever stop them.
      always:
        - name: Stop all stack services
          ansible.builtin.command: qb3rt-down --force
          become: true
          failed_when: false
          changed_when: false
