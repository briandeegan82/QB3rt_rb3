---
# Deploy the HTTPS Date-header time sync hack (see docs/UBUNTU_MIGRATION.md /
# README.md "Operational gotchas #1" for why: the RB3 has no working RTC and
# boots with a wildly wrong clock, and a mid-run NTP step breaks the EKF).
#
# Whole fleet (only reaches whichever of ROS_NET_ODD/EVEN this laptop is
# currently joined to — see inventory/hosts.ini):
#   ansible-playbook playbooks/https-time-sync.yml
#
# One network half, or one unit, to control blast radius:
#   ansible-playbook playbooks/https-time-sync.yml -l qb3rt_even
#   ansible-playbook playbooks/https-time-sync.yml -l qb3rt-6
- name: Deploy HTTPS-based clock sync
  hosts: qb3rt_fleet
  gather_facts: false
  roles:
    - https_time_sync
