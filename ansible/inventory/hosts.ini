# Fleet addressing. Canonical network is ROS_NET_5 (192.168.2.0/24): every
# unit is 192.168.2.<unit#> there, pushed by playbooks/wifi-ros-net-5.yml.
# units/<id>.conf STATIC_IP still describes the dedicated-net fallback
# (odd ids -> 192.168.1.x on ROS_NET_ODD; even ids keep the same .2.x on
# ROS_NET_EVEN, which shares the ROS_NET_5 fabric).
#
# If a unit falls back to ROS_NET_ODD it answers at 192.168.1.<id> instead —
# give the laptop a .1 alias to reach it:
#   nmcli connection up ROS_NET_ODD
#   nmcli device modify wlp4s0 +ipv4.addresses 192.168.1.175/24
# (sudo-free; the alias drops when the connection is re-applied).
[qb3rt_odd]
qb3rt-1  ansible_host=192.168.2.101 ros_net_5_static_ip=192.168.2.101  # .2.1 is the ROS_NET_5 gateway
qb3rt-3  ansible_host=192.168.2.3
qb3rt-5  ansible_host=192.168.2.5
qb3rt-7  ansible_host=192.168.2.7
qb3rt-9  ansible_host=192.168.2.9
qb3rt-11 ansible_host=192.168.2.11
qb3rt-13 ansible_host=192.168.2.13
qb3rt-15 ansible_host=192.168.2.15
qb3rt-17 ansible_host=192.168.2.17
qb3rt-19 ansible_host=192.168.2.19
qb3rt-21 ansible_host=192.168.2.21
qb3rt-23 ansible_host=192.168.2.23
qb3rt-25 ansible_host=192.168.2.25
qb3rt-27 ansible_host=192.168.2.27
qb3rt-29 ansible_host=192.168.2.29

[qb3rt_even]
qb3rt-2  ansible_host=192.168.2.2
qb3rt-4  ansible_host=192.168.2.4
qb3rt-6  ansible_host=192.168.2.6
qb3rt-8  ansible_host=192.168.2.8
qb3rt-10 ansible_host=192.168.2.10
qb3rt-12 ansible_host=192.168.2.12
qb3rt-14 ansible_host=192.168.2.14
qb3rt-16 ansible_host=192.168.2.16
qb3rt-18 ansible_host=192.168.2.18
qb3rt-20 ansible_host=192.168.2.20
qb3rt-22 ansible_host=192.168.2.22
qb3rt-24 ansible_host=192.168.2.24
qb3rt-26 ansible_host=192.168.2.26
qb3rt-28 ansible_host=192.168.2.28
qb3rt-42 ansible_host=192.168.2.42

[qb3rt_fleet:children]
qb3rt_odd
qb3rt_even

# Units running the LLM agent stack (ir_ws) — target of
# playbooks/agent-stack-deps.yml. Must also be listed above.
[qb3rt_agent]
qb3rt-7

[qb3rt_fleet:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/qb3rt_fleet
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null'
