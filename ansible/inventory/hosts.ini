# Test inventory: one unit for validating the https_time_sync role before it
# goes fleet-wide. Mirrors units/6.conf (SSH_HOST/STATIC_IP) — keep in sync by
# hand for now; see ansible/README.md for how to extend this to the rest of
# the fleet once the test unit looks good.
[qb3rt_time_sync_test]
qb3rt-6 ansible_host=192.168.2.6

[qb3rt_time_sync_test:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/qb3rt_fleet
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null'
