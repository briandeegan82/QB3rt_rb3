# Full fleet, split to match the load-balanced Wi-Fi layout in units/*.conf:
# odd ids -> ROS_NET_ODD (192.168.1.0/24), even ids -> ROS_NET_EVEN
# (192.168.2.0/24). Host/IP pairs are hand-kept in sync with units/<id>.conf
# (there's no dynamic inventory here yet).
#
# The laptop running ansible-playbook must itself be joined to whichever of
# ROS_NET_ODD/EVEN it's targeting — the two are separate subnets/APs, not
# bridged, so a single NIC only ever reaches one half at a time.
[qb3rt_odd]
qb3rt-1  ansible_host=192.168.1.101
qb3rt-3  ansible_host=192.168.1.3
qb3rt-5  ansible_host=192.168.1.5
qb3rt-7  ansible_host=192.168.1.7
qb3rt-9  ansible_host=192.168.1.9
qb3rt-11 ansible_host=192.168.1.11
qb3rt-13 ansible_host=192.168.1.13
qb3rt-15 ansible_host=192.168.1.15
qb3rt-17 ansible_host=192.168.1.17
qb3rt-19 ansible_host=192.168.1.19
qb3rt-21 ansible_host=192.168.1.21
qb3rt-23 ansible_host=192.168.1.23
qb3rt-25 ansible_host=192.168.1.25
qb3rt-27 ansible_host=192.168.1.27
qb3rt-29 ansible_host=192.168.1.29

[qb3rt_even]
qb3rt-2  ansible_host=192.168.2.2
qb3rt-4  ansible_host=192.168.2.4
qb3rt-6  ansible_host=192.168.2.6
qb3rt-8  ansible_host=192.168.2.8
qb3rt-10 ansible_host=192.168.2.10
qb3rt-12 ansible_host=192.168.2.12
qb3rt-14 ansible_host=192.168.2.14
qb3rt-16 ansible_host=192.168.2.16
qb3rt-18 ansible_host=192.168.2.18
qb3rt-20 ansible_host=192.168.2.20
qb3rt-22 ansible_host=192.168.2.22
qb3rt-24 ansible_host=192.168.2.24
qb3rt-26 ansible_host=192.168.2.26
qb3rt-28 ansible_host=192.168.2.28

[qb3rt_fleet:children]
qb3rt_odd
qb3rt_even

# Units running the LLM agent stack (ir_ws) — target of
# playbooks/agent-stack-deps.yml. Must also be listed above.
[qb3rt_agent]
qb3rt-7

[qb3rt_fleet:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/qb3rt_fleet
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null'
