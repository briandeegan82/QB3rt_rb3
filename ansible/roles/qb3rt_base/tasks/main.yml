---
# qb3rt_base — fleet-wide identity-independent config. Mirrors
# reference/20_fleet_config.sh so units flashed before a given item was added
# to the golden image still converge to it. Per-unit identity (hostname,
# ROS_DOMAIN_ID value, USB-serial udev symlinks, Wi-Fi) is NOT touched here.

# --- locale (image may ship without en_US.UTF-8; ROS + tooling warn loudly) --
- name: Check for en_US.UTF-8 locale on the unit
  ansible.builtin.command: locale -a
  register: qb3rt_base_locales
  changed_when: false

- name: Generate en_US.UTF-8 locale
  ansible.builtin.command: locale-gen en_US.UTF-8
  become: true
  when: "'en_us.utf8' not in (qb3rt_base_locales.stdout | lower | replace('-', ''))"

- name: Set default locale
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: LANG=en_US.UTF-8
    create: true
    mode: "0644"
  become: true

# --- DDS config + domain seed ------------------------------------------------
- name: Ensure /etc/qb3rt exists
  ansible.builtin.file:
    path: /etc/qb3rt
    state: directory
    mode: "0755"
  become: true

- name: Install CycloneDDS unicast/large-message config
  ansible.builtin.copy:
    src: "{{ qb3rt_base_system_dir }}/cyclonedds.xml"
    dest: /etc/qb3rt/cyclonedds.xml
    mode: "0644"
  become: true

- name: Set the laptop DDS peer for this unit's network
  ansible.builtin.copy:
    dest: /etc/qb3rt/dds_peer
    content: "{{ qb3rt_dds_peer }}\n"
    mode: "0644"
  become: true
  when: qb3rt_dds_peer | default('') | length > 0

- name: Seed default domain_id (only if absent — stamp owns the real value)
  ansible.builtin.copy:
    dest: /etc/qb3rt/domain_id
    content: "{{ qb3rt_base_default_domain_id }}\n"
    mode: "0644"
    force: false
  become: true

# --- passwordless sudo for fleet automation ----------------------------------
# Staged under a dotted name (sudo ignores those), validated, then installed.
- name: Stage sudoers drop-in
  ansible.builtin.copy:
    src: "{{ qb3rt_base_system_dir }}/90-qb3rt-sudoers"
    dest: /etc/sudoers.d/90-qb3rt.staged
    mode: "0440"
  become: true
  register: qb3rt_base_sudoers_staged

- name: Validate sudoers drop-in
  ansible.builtin.command: visudo -cf /etc/sudoers.d/90-qb3rt.staged
  become: true
  changed_when: false
  when: qb3rt_base_sudoers_staged.changed

- name: Install validated sudoers drop-in
  ansible.builtin.command: mv /etc/sudoers.d/90-qb3rt.staged /etc/sudoers.d/90-qb3rt
  become: true
  when: qb3rt_base_sudoers_staged.changed

# --- serial device access ------------------------------------------------------
# /dev/ttyUSB* is root:dialout 0660; the rover bridge and rplidar_node run as
# ubuntu and abort with EACCES without this (seen on qb3rt-12 first boot).
- name: Add ubuntu to the dialout group for serial access
  ansible.builtin.user:
    name: ubuntu
    groups: dialout
    append: true
  become: true

# --- unblock key-based SSH (ubuntu password expiry / cloud-init) -------------
# Ubuntu/cloud-init ships 'ubuntu' with an expired password, which breaks
# non-interactive SSH — i.e. stamp/deploy/Ansible itself.
- name: Clear forced password change on ubuntu
  ansible.builtin.shell: |
    if LC_ALL=C chage -l ubuntu | grep -Eq 'must be changed|^Password expires[[:space:]]*:[[:space:]]*[^n]'; then
      chage -d 20000 -M -1 ubuntu && echo changed
    fi
  become: true
  register: qb3rt_base_chage
  changed_when: "'changed' in qb3rt_base_chage.stdout"

- name: Install cloud-init drop-in stopping password re-expiry
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-qb3rt-unlock.cfg
    content: |
      chpasswd:
        expire: false
      runcmd:
        - [ chage, -d, '20000', -M, '-1', ubuntu ]
        - [ passwd, -u, ubuntu ]
    mode: "0644"
  become: true

- name: Install boot-time unlock service (cloud-init re-expires on first boot)
  ansible.builtin.copy:
    dest: /etc/systemd/system/qb3rt-unlock-ubuntu.service
    content: |
      [Unit]
      Description=QB3rt: clear forced password change on the ubuntu account
      After=cloud-final.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/chage -d 20000 -M -1 ubuntu
      ExecStart=/usr/bin/passwd -u ubuntu
      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  become: true
  notify: enable qb3rt-unlock-ubuntu

# --- kernel UDP buffers for DDS large messages --------------------------------
- name: Install sysctl DDS buffer limits
  ansible.builtin.copy:
    src: "{{ qb3rt_base_system_dir }}/98-agv-dds.conf"
    dest: /etc/sysctl.d/98-agv-dds.conf
    mode: "0644"
  become: true
  notify: reload sysctl

- name: Apply sysctl now (covers units where the file was already in place)
  ansible.builtin.command: sysctl --system
  become: true
  changed_when: false

# --- USB host controller firmware ----------------------------------------------
# The mezzanine's Renesas uPD720201 PCIe USB host controller needs
# renesas_usb_fw.mem at probe time; if it is absent the whole USB bus is dead
# (no lidar/rover). Some images ship without it.
- name: Install Renesas uPD720201 xHCI firmware
  ansible.builtin.copy:
    src: renesas_usb_fw.mem
    dest: /lib/firmware/renesas_usb_fw.mem
    mode: "0644"
  become: true
  register: qb3rt_renesas_fw

- name: Rebind xhci_hcd so the firmware is picked up without a reboot
  ansible.builtin.shell: |
    for dev in /sys/bus/pci/drivers/xhci_hcd/000*:*; do
      [ -e "$dev" ] && echo "$(basename "$dev")" > /sys/bus/pci/drivers/xhci_hcd/unbind
    done
    sleep 2
    for dev in /sys/bus/pci/devices/*/class; do
      [ "$(cat "$dev")" = "0x0c0330" ] && echo "$(basename "$(dirname "$dev")")" > /sys/bus/pci/drivers/xhci_hcd/bind
    done
    sleep 3
  become: true
  when: qb3rt_renesas_fw.changed

# --- udev ---------------------------------------------------------------------
- name: Install OAK-D / DepthAI udev rules
  ansible.builtin.copy:
    src: "{{ qb3rt_base_system_dir }}/80-movidius.rules"
    dest: /etc/udev/rules.d/80-movidius.rules
    mode: "0644"
  become: true
  notify: reload udev

# ros-jazzy-rplidar-ros ships a catch-all rule giving EVERY CP2102N a
# /dev/rplidar link — including the rover's own adapter — and it sorts after
# the per-serial 99-agv-serial.rules stamp writes. Deleting it is safe: it is
# a dpkg conffile, so package upgrades do not restore it.
- name: Remove rplidar catch-all udev rule (wins over per-serial rules)
  ansible.builtin.file:
    path: /etc/udev/rules.d/rplidar.rules
    state: absent
  become: true
  notify: reload udev

# --- login-shell ROS environment ----------------------------------------------
- name: Install /etc/profile.d/qb3rt-ros-env.sh
  ansible.builtin.copy:
    src: "{{ qb3rt_base_system_dir }}/qb3rt-ros-env.sh"
    dest: /etc/profile.d/qb3rt-ros-env.sh
    mode: "0644"
  become: true

# --- sensor_service boot race self-heal ---------------------------------------
# If sensor_service runs its SUID discovery before the SSC remoteproc is up it
# gets suid=0 and never creates /dev/shm/server_socket — the unit boots with a
# permanently dead IMU (seen on qb3rt-7, 2026-10-09). The service stays
# "active" so Restart=always can't help; a timer checks for the socket instead.
- name: Install sensor-service socket watchdog script
  ansible.builtin.copy:
    src: qb3rt-sensor-socket-check.sh
    dest: /usr/local/sbin/qb3rt-sensor-socket-check
    mode: "0755"
  become: true

- name: Install sensor-service socket watchdog units
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    mode: "0644"
  become: true
  notify: enable qb3rt-sensor-watch
  loop:
    - dest: /etc/systemd/system/qb3rt-sensor-watch.service
      content: |
        [Unit]
        Description=QB3rt: restart sensor_service if its client socket is missing
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/qb3rt-sensor-socket-check
    - dest: /etc/systemd/system/qb3rt-sensor-watch.timer
      content: |
        [Unit]
        Description=QB3rt sensor_service socket watchdog
        [Timer]
        OnBootSec=90
        OnUnitActiveSec=60
        [Install]
        WantedBy=timers.target

# A task, not just the handler: if the unit files already exist (e.g. an
# earlier base-config died after installing them but before handlers ran),
# the handler never fires and the watchdog stays disabled — qb3rt-16 hit
# exactly this and /imu/data stayed dead.
- name: Ensure sensor-watch timer is enabled and running
  ansible.builtin.systemd:
    name: qb3rt-sensor-watch.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true

# --- QAIRT 2.49 runtime upgrade ------------------------------------------------
# Stock noble apt ships qairt 2.46, whose V68 DSP skel cannot create MatMul ops
# and which rejects every context binary AI Hub can produce (they only offer
# 2.45/2.49/2.50 toolchains; blobs built newer than the runtime are refused).
# The qcom-ppa resolute suite carries 2.49 debs whose runtime deps are already
# satisfied functionally by the image's qcom-fastrpc1 (1.0.15) + running
# fastrpc/dsp daemons, so install with --force-depends rather than pulling the
# resolute libfastrpc1/hexagon-dsp-binaries stack over the working one.
# Debs live in files/qairt/ (gitignored); fetch them with fetch-qairt-debs.sh.
- name: Ensure QAIRT staging dir exists
  ansible.builtin.file:
    path: /tmp/qairt249
    state: directory
    mode: "0755"
  become: true

- name: Stage QAIRT 2.49 debs on the unit
  ansible.builtin.copy:
    src: "qairt/{{ item }}"
    dest: "/tmp/qairt249/{{ item }}"
    mode: "0644"
  become: true
  loop:
    - "qairt-dsp-binaries_2.49.0-0ubuntu2_arm64.deb"
    - "qairt-libs_2.49.0-0ubuntu2_arm64.deb"
    - "qairt-tools_2.49.0-0ubuntu2_arm64.deb"
    - "libqnn1_2.49.0-0ubuntu2_arm64.deb"
  register: qb3rt_base_qairt_debs

- name: Check installed qairt-libs version
  ansible.builtin.command: dpkg-query -W -f=${Version} qairt-libs
  register: qb3rt_base_qairt_version
  changed_when: false
  failed_when: false

- name: Install QAIRT 2.49 (deps covered by qcom-fastrpc1)
  ansible.builtin.command: >-
    dpkg --force-depends -i
    /tmp/qairt249/qairt-dsp-binaries_2.49.0-0ubuntu2_arm64.deb
    /tmp/qairt249/qairt-libs_2.49.0-0ubuntu2_arm64.deb
    /tmp/qairt249/qairt-tools_2.49.0-0ubuntu2_arm64.deb
    /tmp/qairt249/libqnn1_2.49.0-0ubuntu2_arm64.deb
  become: true
  when: >
    qb3rt_base_qairt_version.rc != 0
    or qb3rt_base_qairt_version.stdout is version('2.49', '<')

# The 2.49 debs declare phantom deps (libfastrpc1/hexagon-dsp-binaries/
# fastrpc-support — Qualcomm-internal names, functionally covered by the
# installed qcom-fastrpc1 + qairt-dsp-binaries). --force-depends installs them
# anyway, but every subsequent apt resolution fails until the dpkg database is
# repaired. Also relax the stale qairt-headers 2.46 pin on qairt-libs.
- name: Repair dpkg metadata for QAIRT 2.49 phantom deps (un-breaks apt)
  ansible.builtin.shell: |
    python3 - <<'PYEOF'
    s = open("/var/lib/dpkg/status").read()
    blocks = s.split("\n\n")
    changed = False
    for i, b in enumerate(blocks):
        if b.startswith("Package: qairt-libs\n") and "hexagon-dsp-binaries" in b:
            blocks[i] = b.replace("libfastrpc1 (>= 1.0.6), ", "") \
                         .replace(", hexagon-dsp-binaries, fastrpc-support", "")
            changed = True
        elif b.startswith("Package: qairt-headers\n") and "qairt-libs (= 2.46" in b:
            blocks[i] = b.replace("qairt-libs (= 2.46.0-0ubuntu1~bpo24.04.1)",
                                  "qairt-libs (>= 2.43.0.260128-0ubuntu2)")
            changed = True
    if changed:
        open("/var/lib/dpkg/status", "w").write("\n\n".join(blocks))
        print("repaired")
    else:
        print("already clean")
    PYEOF
  become: true
  register: qb3rt_dpkg_repair
  changed_when: "'repaired' in qb3rt_dpkg_repair.stdout"

# 2.49 qairt-dsp-binaries installs skels under /usr/share/hexagon-dsp/, but the
# golden image left unmanaged copies under /usr/share/qcom/ that
# /usr/lib/dsp/cdsp/*.so symlinks point at — without repointing, the host libs
# are 2.49 while the DSP still loads the old skels (Device Creation failure).
- name: Repoint QNN DSP skel symlinks to the 2.49 copies
  ansible.builtin.file:
    src: "/usr/share/hexagon-dsp/qcm6490/Thundercomm/RB3gen2/dsp/cdsp/{{ item }}"
    dest: "/usr/lib/dsp/cdsp/{{ item }}"
    state: link
    force: true
  become: true
  loop:
    - libQnnHtpV68.so
    - libQnnHtpV68Skel.so
    - libQnnHtpV68QemuDriver.so
    - libQnnHtpNetRunExtensions.so
    - libQnnSystem.so
    - libQnnSaver.so
  notify: restart cdsprpcd

# --- YOLOE model artifacts ----------------------------------------------------
# AI Hub yoloe_seg context binaries (QAIRT 2.49 / V68). Not in git (~92 MB) —
# stage them once on the control host:
#   ansible/roles/qb3rt_base/files/yoloe/fetch-yoloe-models.sh
# The matching vocab/quant sidecars (config/yoloe_*.yaml) ship in the QB3rt
# payload via update_project.sh; only the .bins come through here.
- name: Check YOLOE model staging on the control host
  ansible.builtin.stat:
    path: "{{ role_path }}/files/yoloe/{{ item }}"
  delegate_to: localhost
  register: qb3rt_base_yoloe_staged
  loop:
    - yoloe_coco80_qa249.bin
    - yoloe_lab_qa249.bin

- name: Ensure /home/ubuntu/models exists (ubuntu-owned)
  ansible.builtin.file:
    path: /home/ubuntu/models
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  become: true

- name: Sync YOLOE context binaries to the unit
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/yoloe/{{ item.item }}"
    dest: "/home/ubuntu/models/{{ item.item }}"
  when: item.stat.exists
  loop: "{{ qb3rt_base_yoloe_staged.results }}"

- name: Ensure models are ubuntu-owned
  ansible.builtin.file:
    path: "/home/ubuntu/models/{{ item.item }}"
    owner: ubuntu
    group: ubuntu
  become: true
  when: item.stat.exists
  loop: "{{ qb3rt_base_yoloe_staged.results }}"

- name: Warn when YOLOE models are not staged on the control host
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: no yoloe_*.bin staged in files/yoloe/ — run
      files/yoloe/fetch-yoloe-models.sh once on the control host. The unit will
      still launch perception.launch.py but the inference node will fail to
      open its model.
  when: not (qb3rt_base_yoloe_staged.results | selectattr('stat.exists') | list)

# --- RF2O laser odometry ------------------------------------------------------
# Scan-matched odometry consumed by the EKF as odom2 (see config/ekf.yaml and
# launch/odometry.launch.py). No ros-jazzy deb exists and per-unit colcon
# builds are fragile on this fleet (broken fastrpc-support dep + the lab
# network's TLS interception breaks github clones), so a stripped arm64
# binary built on qb3rt-12 ships as a merged-install tree — extracting at the
# overlay root lands the node in lib/ and its ament markers under
# share/ament_index/. Provenance/rebuild notes: files/rf2o/README.md.
- name: Check QB3rt overlay for the RF2O merge target
  ansible.builtin.stat:
    path: /opt/qb3rt/install/share/ament_index/resource_index/packages
  register: qb3rt_base_ament_index

- name: Stage RF2O merged-install tarball on the unit
  ansible.builtin.copy:
    src: rf2o/rf2o_laser_odometry.tar.gz
    dest: /tmp/rf2o_laser_odometry.tar.gz
    mode: "0644"
  become: true
  register: qb3rt_base_rf2o_staged
  when: qb3rt_base_ament_index.stat.exists

- name: Merge RF2O into the /opt/qb3rt overlay
  ansible.builtin.command:
    tar -xzf /tmp/rf2o_laser_odometry.tar.gz -C /opt/qb3rt/install
  become: true
  when: qb3rt_base_ament_index.stat.exists and qb3rt_base_rf2o_staged.changed

- name: Remove staged RF2O tarball (root-owned, /tmp is sticky)
  ansible.builtin.file:
    path: /tmp/rf2o_laser_odometry.tar.gz
    state: absent
  become: true
  when: qb3rt_base_rf2o_staged is not skipped

- name: Warn when RF2O install was skipped (no overlay yet)
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: /opt/qb3rt overlay not found — RF2O not
      installed. Deploy the project (deploy/update_project.sh), which also
      merges the binary, or rerun this role after the overlay exists.
  when: not qb3rt_base_ament_index.stat.exists

# --- OpenVINS ov_msckf (experimental VIO) --------------------------------------
# Stereo-capable MSCKF visual-inertial odometry, configured mono OV9282 + IMU
# for the RB3. EXPERIMENTAL: deploys the binaries + a Kalibr'd config only —
# nothing consumes its output yet (not wired into the EKF) and init currently
# diverges on this rig (see files/openvins/README.md). Same merged-install
# pattern as RF2O: no deb, per-unit builds are fragile, so a stripped arm64
# tree built on qb3rt-12 ships as a tarball.
- name: Stage OpenVINS merged-install tarball on the unit
  ansible.builtin.copy:
    src: openvins/openvins_ov_msckf.tar.gz
    dest: /tmp/openvins_ov_msckf.tar.gz
    mode: "0644"
  become: true
  register: qb3rt_base_openvins_staged
  when: qb3rt_base_ament_index.stat.exists

- name: Merge OpenVINS into the /opt/qb3rt overlay
  ansible.builtin.command:
    tar -xzf /tmp/openvins_ov_msckf.tar.gz -C /opt/qb3rt/install
  become: true
  when: qb3rt_base_ament_index.stat.exists and qb3rt_base_openvins_staged.changed

- name: Remove staged OpenVINS tarball (root-owned, /tmp is sticky)
  ansible.builtin.file:
    path: /tmp/openvins_ov_msckf.tar.gz
    state: absent
  become: true
  when: qb3rt_base_openvins_staged is not skipped

# --- per-unit hardware convention probe ---------------------------------------
# Installed but NOT run by base-config — it drives the wheels and needs an
# operator placing a calibration obstacle. Run interactively per unit:
#   ansible-playbook playbooks/convention-probe.yml -l qb3rt-N
# It writes /etc/qb3rt/unit_conventions.yaml, which the bridge (drive_inverted)
# and static_transforms.launch.py (lidar_yaw) read at every startup — so the
# measured baseline survives project redeploys and reflashes stay correct.
- name: Install convention probe + preflight scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item | basename | regex_replace('\\.py$', '') }}"
    mode: "0755"
  become: true
  loop:
    - qb3rt-convention-probe.py
    - qb3rt-preflight.py

# --- ament registration sanity -------------------------------------------------
# `ros2 launch QB3rt ...` needs the ament index marker under the install prefix.
# update_project.sh creates it on deploy; this flags units where the project
# has never been deployed rather than silently leaving a broken bringup.
- name: Check QB3rt ament registration
  ansible.builtin.stat:
    path: /opt/qb3rt/install/share/ament_index/resource_index/packages/QB3rt
  register: qb3rt_base_ament_marker

- name: Warn if the QB3rt project is not deployed/registered
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: /opt/qb3rt/install has no QB3rt ament marker —
      `ros2 launch QB3rt ...` will fail until deploy/update_project.sh runs.
  when: not qb3rt_base_ament_marker.stat.exists
