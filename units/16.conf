# Per-unit profile for stamp/stamp_unit.sh --unit 16

# --- SSH reachability -------------------------------------------------------
# Dedicated network (load-balanced fleet, even ids): ROS_NET_EVEN, 192.168.2.0/24.
# Unit is currently still reachable at its OLD address (single-subnet scheme);
# first restamp on the new network needs an override:
#   stamp_unit.sh --unit 16 --host ubuntu@192.168.0.16
# Subsequent runs use SSH_HOST below once the unit has switched over.
SSH_HOST=ubuntu@192.168.2.16

# Hostname stamped onto the unit.
HOSTNAME=qb3rt-16

# --- ROS identity -----------------------------------------------------------
DOMAIN_ID=16

# --- Static IP --------------------------------------------------------------
# Pinned so the IP matches the unit id on its dedicated network. stamp applies
# it and the unit switches ~3s after the stamp session closes.
# (Ensure the AP's DHCP pool doesn't overlap the static range.)
STATIC_IP=192.168.2.16

# --- USB device pinning -----------------------------------------------------
# CP2102N chip serials (udevadm info -q property -n /dev/ttyUSB* on the robot).
# TODO: fill in once this unit's lidar + rover adapters are attached; until then
# stamp writes no /dev/rplidar,/dev/wave_rover symlinks (bench unit has none).
USB_RPLIDAR_SERIAL=7ef5173dcd73ef118610cf8c8fcc3fa0
USB_WAVE_ROVER_SERIAL=cc8232ead2d9ef11a5bd4d3dc8728757

# --- Wi-Fi --------------------------------------------------------------
# Even-id half of the load-balanced fleet.
WIFI_KEEP=ROS_NET_EVEN,ROS_NET_5
WIFI_SSID=ROS_NET_EVEN
WIFI_PSK=   # from units/secrets.env (see units/secrets.env.example)
# wlan0 hardware address — used for the UoGPSK reserve network's DHCP
# reservation (static self-assigned IPs are dropped there by DHCP
# snooping/dynamic ARP inspection, so campus IT binds IP<->MAC instead).
WIFI_MAC=f0:74:e4:82:03:38

# --- Reserve network (fleet-wide backup, hidden SSID, never auto-connects) --
WIFI_RESERVE_SSID=UoGPSK
WIFI_RESERVE_PSK=   # from units/secrets.env (see units/secrets.env.example)
