# Per-unit profile for stamp/stamp_unit.sh --unit 16

# --- SSH reachability -------------------------------------------------------
# This AP (ros_net_5G) has multicast off, so mDNS (.local) is unreliable — use
# the IP. wlan0 MAC f0:74:e4:82:03:38; add a DHCP reservation on the AP to keep
# this IP stable, or override per-run with:  stamp_unit.sh --unit 16 --host ...
SSH_HOST=ubuntu@192.168.0.16

# Hostname stamped onto the unit.
HOSTNAME=qb3rt-16

# --- ROS identity -----------------------------------------------------------
DOMAIN_ID=16

# --- Static IP --------------------------------------------------------------
# Pinned so the IP matches the unit id (192.168.0.16). stamp applies it and the
# unit switches ~3s after the stamp session closes. FIRST stamp of a fresh unit
# still uses --host <dhcp-ip> (from discover.sh); it moves to STATIC_IP after.
# (Ensure the AP's DHCP pool doesn't overlap the static range.)
STATIC_IP=192.168.0.16

# --- USB device pinning -----------------------------------------------------
# CP2102N chip serials (udevadm info -q property -n /dev/ttyUSB* on the robot).
# TODO: fill in once this unit's lidar + rover adapters are attached; until then
# stamp writes no /dev/rplidar,/dev/wave_rover symlinks (bench unit has none).
USB_RPLIDAR_SERIAL=
USB_WAVE_ROVER_SERIAL=

# --- Wi-Fi ------------------------------------------------------------------
WIFI_KEEP=ros_net_5G,ROS_NET
WIFI_SSID=
WIFI_PSK=
