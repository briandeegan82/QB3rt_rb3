# Template per-unit profile. Copy to <id>.conf and fill in per robot, then:
#   stamp/stamp_unit.sh --unit <id>
#
# Load-balanced fleet: odd ids -> ROS_NET_ODD (192.168.1.0/24),
# even ids -> ROS_NET_EVEN (192.168.2.0/24). Static IP = 192.168.<1|2>.<id>.
SSH_HOST=ubuntu@192.168.X.XX
HOSTNAME=qb3rt-XX
DOMAIN_ID=XX
STATIC_IP=192.168.X.XX   # pin IP to match the unit id (omit to keep DHCP)
USB_RPLIDAR_SERIAL=
USB_WAVE_ROVER_SERIAL=
WIFI_KEEP=ROS_NET_ODD_OR_EVEN
WIFI_SSID=ROS_NET_ODD_OR_EVEN
WIFI_PSK=robotics

# Reserve network (fleet-wide backup, hidden SSID, never auto-connects).
WIFI_RESERVE_SSID=UoGPSK
WIFI_RESERVE_PSK=UoGEnGG037@3003
