# Per-unit profile for stamp/stamp_unit.sh --unit 1

# --- SSH reachability -------------------------------------------------------
# Dedicated network (load-balanced fleet, odd ids): ROS_NET_ODD, 192.168.1.0/24.
# Unit is currently still reachable at its OLD address (single-subnet scheme);
# first restamp on the new network needs an override:
#   stamp_unit.sh --unit 1 --host ubuntu@192.168.0.201
# Subsequent runs use SSH_HOST below once the unit has switched over.
SSH_HOST=ubuntu@192.168.1.101

# Hostname stamped onto the unit.
HOSTNAME=qb3rt-1

# --- ROS identity -----------------------------------------------------------
DOMAIN_ID=1

# --- Static IP --------------------------------------------------------------
# NOTE: unit id 1 can't take 192.168.1.1 — that's the ROS_NET_ODD router's own
# gateway address. Bumped to .101 (only unit 1 needs this; every other unit's
# IP still matches its id). stamp applies it and the unit switches ~3s after
# the stamp session closes. (Ensure the AP's DHCP pool doesn't overlap this.)
STATIC_IP=192.168.1.101

# --- USB device pinning -----------------------------------------------------
# CP2102N chip serials (udevadm info -q property -n /dev/ttyUSB* on the robot).
USB_RPLIDAR_SERIAL=de22b192dd73ef11a776cf8c8fcc3fa0
USB_WAVE_ROVER_SERIAL=9c187881429bef1182b9b29061ce3355

# --- Wi-Fi --------------------------------------------------------------
# Odd-id half of the load-balanced fleet.
WIFI_KEEP=ROS_NET_ODD
WIFI_SSID=ROS_NET_ODD
WIFI_PSK=robotics
# wlan0 hardware address — used for the UoGPSK reserve network's DHCP
# reservation (static self-assigned IPs are dropped there by DHCP
# snooping/dynamic ARP inspection, so campus IT binds IP<->MAC instead).
WIFI_MAC=f0:74:e4:82:00:bf

# --- Reserve network (fleet-wide backup, hidden SSID, never auto-connects) --
WIFI_RESERVE_SSID=UoGPSK
WIFI_RESERVE_PSK=UoGEnGG037@3003
