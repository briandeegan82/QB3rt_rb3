# Per-unit profile for stamp/stamp_unit.sh --unit 22

# --- SSH reachability -------------------------------------------------------
# Dedicated network (load-balanced fleet, even ids): ROS_NET_EVEN, 192.168.2.0/24.
# First stamp reached the fresh unit via the provisioning AP at DHCP 192.168.0.100:
#   stamp_unit.sh --unit 22 --host ubuntu@192.168.0.100
# Subsequent runs use SSH_HOST below once the unit has switched over.
SSH_HOST=ubuntu@192.168.2.22

# Hostname stamped onto the unit.
HOSTNAME=qb3rt-22

# --- ROS identity -----------------------------------------------------------
DOMAIN_ID=22

# --- Static IP --------------------------------------------------------------
# Pinned so the IP matches the unit id on its dedicated network. stamp applies
# it and the unit switches ~3s after the stamp session closes.
# (Ensure the AP's DHCP pool doesn't overlap the static range.)
STATIC_IP=192.168.2.22

# --- USB device pinning -----------------------------------------------------
# CP2102N chip serials (udevadm info -q property -n /dev/ttyUSB* on the robot).
# PENDING HARDWARE: lidar + rover not yet delivered. Once attached run:
#   stamp/read_serials.sh --unit 22 --assign --write
#   stamp/stamp_unit.sh --unit 22
# Until then stamp writes no /dev/rplidar,/dev/wave_rover symlinks.
USB_RPLIDAR_SERIAL=8a759d66db6ff011bac993301045c30f
USB_WAVE_ROVER_SERIAL=e29a19d21c7fef1186f7221cedd322a4
# HARDWARE CHANGE 2026-11-09: the driver board's onboard CP2102N behind the
# "USB" port (serial above) died — port enumerates nothing. wave_rover link is
# now an external CH343 USB-UART adapter (1a86:55d4, no serial) wired to the
# host UART on the 40-pin header. /etc/udev/rules.d/99-agv-serial.rules on the
# unit was edited by hand to match 1a86:55d4 — a re-stamp will overwrite it and
# must be reverted to the 1a86 line (or the dead bridge replaced first).

# --- Wi-Fi --------------------------------------------------------------
# Even-id half of the load-balanced fleet.
WIFI_KEEP=ROS_NET_EVEN,ROS_NET_5
WIFI_SSID=ROS_NET_EVEN
WIFI_PSK=   # from units/secrets.env (see units/secrets.env.example)
# wlan0 hardware address — used for the UoGPSK reserve network's DHCP
# reservation (static self-assigned IPs are dropped there by DHCP
# snooping/dynamic ARP inspection, so campus IT binds IP<->MAC instead).
WIFI_MAC=f0:74:e4:82:00:7d

# --- Reserve network (fleet-wide backup, hidden SSID, never auto-connects) --
WIFI_RESERVE_SSID=UoGPSK
WIFI_RESERVE_PSK=   # from units/secrets.env (see units/secrets.env.example)
