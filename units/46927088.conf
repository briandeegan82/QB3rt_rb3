# Per-unit profile for deploy_via_adb.sh --unit <name>
# ADB serial from `adb devices -l` (also usable as the --unit name).
ADB_SERIAL=46927088

# ROS_DOMAIN_ID — unique per physical robot on the same wifi.
DOMAIN_ID=11

# Silicon Labs CP2102N chip serials (udevadm info -q property -n /dev/ttyUSB*).
# These create /dev/rplidar and /dev/wave_rover via 99-agv-serial.rules.
USB_RPLIDAR_SERIAL=f613e1eb20e6ed119484d8a80b2af5ab
USB_WAVE_ROVER_SERIAL=90473affd2d9ef11b7014d3dc8728757

# WiFi connections to KEEP when running --clean (comma-separated NM names/SSIDs).
# All other saved WiFi profiles are deleted so student phone-hotspot passwords
# are not handed to the next class. Empty WIFI_KEEP= means wipe all WiFi.
WIFI_KEEP=ros_net_5G,ROS_NET
