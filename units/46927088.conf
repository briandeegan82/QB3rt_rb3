# Per-unit profile for stamp/stamp_unit.sh --unit 46927088
# (Filename is a stable per-robot id; the CP2102N serials below are what
#  physically identify this chassis.)

# --- SSH reachability (Ubuntu image: default user is `ubuntu`) ---------------
# Host or user@host. mDNS (.local) works once HOSTNAME below is stamped.
SSH_HOST=ubuntu@qb3rt-11.local

# Hostname to stamp onto the unit (also its mDNS name).
HOSTNAME=qb3rt-11

# --- ROS identity -----------------------------------------------------------
# ROS_DOMAIN_ID — unique per physical robot on the same wifi.
DOMAIN_ID=11

# --- USB device pinning -----------------------------------------------------
# Silicon Labs CP2102N chip serials (udevadm info -q property -n /dev/ttyUSB*).
# These create /dev/rplidar and /dev/wave_rover via a generated udev rule.
USB_RPLIDAR_SERIAL=f613e1eb20e6ed119484d8a80b2af5ab
USB_WAVE_ROVER_SERIAL=90473affd2d9ef11b7014d3dc8728757

# --- Wi-Fi ------------------------------------------------------------------
# Connections to KEEP during a class-handoff wipe (comma-separated NM names).
# All other saved profiles are deleted so student hotspot passwords are not
# handed to the next class. Empty = wipe all Wi-Fi.
WIFI_KEEP=ros_net_5G,ROS_NET

# Optional: lab Wi-Fi for stamp --wifi to (re)join. Leave blank to skip.
WIFI_SSID=
WIFI_PSK=
