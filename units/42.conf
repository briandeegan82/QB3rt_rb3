# Per-unit profile for stamp/stamp_unit.sh --unit 42
#
# GOLDEN SAMPLE — not part of the numbered 1-16 production fleet. This is the
# reference unit capture/make_golden.sh images from (see docs/UBUNTU_MIGRATION.md
# Phase A/B), and it doubles as the laptop's fixed single-robot Nav2 dev/demo
# target (laptop/qb3rt_env.sh hardcodes ROS_DOMAIN_ID=42 for this reason).
# wlan0 MAC f0:74:e4:81:fe:68 matches the unit previously referenced as
# "board 42" in laptop/qb3rt_env.sh's history — this profile restores its
# identity after a reflash, it is not a new physical unit.

# --- SSH reachability -------------------------------------------------------
# First stamp: freshly flashed, reachable via the provisioning AP (ros_net_5G,
# 192.168.0.0/24) at whatever DHCP IP it lands on (see stamp/discover.sh).
# Subsequent runs use SSH_HOST below once it has switched to ROS_NET_EVEN.
SSH_HOST=ubuntu@192.168.2.42

# Hostname stamped onto the unit.
HOSTNAME=qb3rt-42

# --- ROS identity -----------------------------------------------------------
# 42, not a fleet-sequential id — see note above.
DOMAIN_ID=42

# --- Static IP --------------------------------------------------------------
# Even (matches ROS_NET_EVEN below); .42 to match the domain/hostname, not a
# fleet position. stamp applies it and the unit switches ~3s after the stamp
# session closes. (Ensure the AP's DHCP pool doesn't overlap this.)
STATIC_IP=192.168.2.42

# --- USB device pinning -----------------------------------------------------
# CP2102N chip serials (udevadm info -q property -n /dev/ttyUSB* on the robot).
# TODO: fill in once RPLIDAR + wave_rover adapters are attached; until then
# stamp writes no /dev/rplidar,/dev/wave_rover symlinks (bench unit has none).
USB_RPLIDAR_SERIAL=
USB_WAVE_ROVER_SERIAL=

# --- Wi-Fi --------------------------------------------------------------
WIFI_KEEP=ROS_NET_EVEN
WIFI_SSID=ROS_NET_EVEN
WIFI_PSK=robotics
# wlan0 hardware address — used for the UoGPSK reserve network's DHCP
# reservation (static self-assigned IPs are dropped there by DHCP
# snooping/dynamic ARP inspection, so campus IT binds IP<->MAC instead).
WIFI_MAC=f0:74:e4:81:fe:68

# --- Reserve network (fleet-wide backup, hidden SSID, never auto-connects) --
WIFI_RESERVE_SSID=UoGPSK
WIFI_RESERVE_PSK=UoGEnGG037@3003
