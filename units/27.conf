# Per-unit profile for stamp/stamp_unit.sh --unit 27

# --- SSH reachability -------------------------------------------------------
# Dedicated network (load-balanced fleet, odd ids): ROS_NET_ODD, 192.168.1.0/24.
# First stamp was done entirely over UART (unit had never joined any lab
# Wi-Fi yet), so this is the address it lands on once ROS_NET_ODD is up.
SSH_HOST=ubuntu@192.168.1.27

# Hostname stamped onto the unit.
HOSTNAME=qb3rt-27

# --- ROS identity -----------------------------------------------------------
DOMAIN_ID=27

# --- Static IP --------------------------------------------------------------
# Pinned so the IP matches the unit id on its dedicated network. stamp applies
# it and the unit switches ~3s after the stamp session closes.
# (Ensure the AP's DHCP pool doesn't overlap the static range.)
STATIC_IP=192.168.1.27

# --- USB device pinning -----------------------------------------------------
# CP2102N chip serials (udevadm info -q property -n /dev/ttyUSB* on the robot).
# TODO: fill in once this unit's lidar + rover adapters are attached:
#   stamp/read_serials.sh --unit 27 --assign --write
#   stamp/stamp_unit.sh --unit 27
# Until then stamp writes no /dev/rplidar,/dev/wave_rover symlinks.
USB_RPLIDAR_SERIAL=
USB_WAVE_ROVER_SERIAL=

# --- Wi-Fi --------------------------------------------------------------
# Odd-id half of the load-balanced fleet.
WIFI_KEEP=ROS_NET_ODD
WIFI_SSID=ROS_NET_ODD
WIFI_PSK=   # from units/secrets.env (see units/secrets.env.example)
# wlan0 hardware address — used for the UoGPSK reserve network's DHCP
# reservation (static self-assigned IPs are dropped there by DHCP
# snooping/dynamic ARP inspection, so campus IT binds IP<->MAC instead).
WIFI_MAC=f0:74:e4:81:ff:19

# --- Reserve network (fleet-wide backup, hidden SSID, never auto-connects) --
WIFI_RESERVE_SSID=UoGPSK
WIFI_RESERVE_PSK=   # from units/secrets.env (see units/secrets.env.example)
